name: CI

on:
  push:
    branches: [ main, master, "pq-crypto-refactor" ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rendezvous-server:
    name: rendezvous server (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies: the server and its tests use only Node built-ins.
      - name: Test rendezvous server
        working-directory: rendezvous-server
        run: node --test

  security-scans:
    name: security scans (Semgrep guardrail, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo-local rule: decrypted media must never be written to disk outside the allowlist.
      - name: Semgrep guardrail (no plaintext file writes)
        run: |
          pip install --quiet semgrep==1.182.1
          semgrep scan --config .semgrep --error --metrics off app/src/main/kotlin

      # Release binary pinned by SHA-256 (checked against the published checksums).
      - name: gitleaks (secrets)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact

  crypto:
    name: crypto (pure-JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The whole crypto suite is pure-JVM (no liboqs/JNI, no Android SDK), so it
      # runs standalone on a plain Linux runner.
      - name: Test crypto module
        run: ./gradlew -p crypto test --no-daemon --stacktrace

      # Republish com.aura:aura-crypto into the in-repo Maven repo so the app
      # build below resolves the freshly-built artifact.
      - name: Publish aura-crypto into libs/maven
        run: ./gradlew -p crypto publish --no-daemon --stacktrace

      # Replays every Jazzer fuzz target (seconds); fuzzing itself runs on demand with FUZZ=1.
      - name: Replay fuzz targets
        run: ./gradlew -p crypto fuzzTest --no-daemon --stacktrace

      - name: Upload crypto test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-test-report
          path: crypto/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: app (Robolectric)
    runs-on: ubuntu-latest
    needs: crypto
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The legacy "tools" package (in the action's default list) no longer exists in
      # current cmdline-tools; Gradle installs the platform and build-tools itself.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # aura-crypto is vendored in libs/maven, but rebuild + republish it first so
      # app tests always run against the current crypto sources.
      - name: Publish aura-crypto into libs/maven
        run: ./gradlew -p crypto publish --no-daemon --stacktrace

      - name: Run app unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Known-vulnerability scan of the dependencies that actually ship: resolve the release
      # and crypto runtime graphs, then scan them. Binary pinned by SHA-256.
      - name: OSV-Scanner (dependencies)
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q > app-deps.txt
          ./gradlew -p crypto dependencies --configuration runtimeClasspath --no-daemon -q > crypto-deps.txt
          python3 scripts/gradle-deps-to-lockfile.py gradle.lockfile app-deps.txt crypto-deps.txt
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan -L gradle.lockfile

      - name: Upload app test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
